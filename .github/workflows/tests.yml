name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare placeholder configuration
        run: cp config.example.py config.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python modules
        run: python -m py_compile group_bot.py growth_db.py cross_promo.py
      - name: Import bot with placeholder configuration
        run: python -c "import group_bot; print('group_bot import OK')"
